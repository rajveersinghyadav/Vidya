<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidya - Real SMC & Order Flow Engine</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0e11;
            color: #d1d4dc;
            margin: 0;
            padding: 12px;
        }
        h1 {
            font-size: 18px;
            color: #f0b90b;
            margin-bottom: 2px;
        }
        .subtitle {
            font-size: 11px;
            color: #848e9c;
            margin-bottom: 12px;
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        select, button {
            background-color: #1e2329;
            color: #fff;
            border: 1px solid #2b313a;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        select { flex: 1; }
        .btn-primary {
            background-color: #f0b90b;
            color: #000;
            font-weight: bold;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
        }
        /* Bookmap Heatmap Visual Box */
        #heatmap-container {
            width: 100%;
            height: 300px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid #30363d;
            position: relative;
            overflow: hidden;
            display: flex;
        }
        .heatmap-grid {
            flex: 1;
            background: linear-gradient(to bottom, #161b22 0%, #0d1117 100%);
            position: relative;
        }
        .orderbook-side {
            width: 85px;
            background: #161b22;
            border-left: 1px solid #30363d;
            font-size: 10px;
            padding: 6px;
            color: #848e9c;
            font-family: monospace;
        }
        .liquidity-level {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(255, 165, 0, 0.7);
        }
        .volume-bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(14, 203, 129, 0.75);
            border: 1px solid #0ecb81;
            transform: translate(-50%, -50%);
        }
        .signal-box {
            background-color: #1e2329;
            border: 1px solid #2b313a;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
        }
        .signal-box h3 { margin-top: 0; font-size: 14px; color: #0ecb81; }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .metric-card {
            background: #12161c;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #2b313a;
        }
        .metric-title { font-size: 10px; color: #848e9c; }
        .metric-value { font-size: 13px; font-weight: bold; color: #fff; margin-top: 2px; }
        .reason-text { font-size: 11px; color: #eaecef; line-height: 1.4; }
    </style>
</head>
<body>

    <h1>Vidya - Order Flow & SMC Engine</h1>
    <div class="subtitle">Live Heatmap Visualization & Real Mathematical Risk-Reward Calculation</div>

    <div class="controls">
        <select id="assetSelect" onchange="renderHeatmap()">
            <option value="BTCUSDT" data-pair="BTCUSDT">Bitcoin (BTC/USDT)</option>
            <option value="ETHUSDT" data-pair="ETHUSDT">Ethereum (ETH/USDT)</option>
            <option value="SOLUSDT" data-pair="SOLUSDT">Solana (SOL/USDT)</option>
            <option value="XAUUSD" data-pair="XAUUSD">Gold (XAU/USD)</option>
        </select>
        <select id="tfSelect">
            <option value="15m" selected>15m Order Flow</option>
            <option value="1h">1h Order Flow</option>
            <option value="4h">4h Order Flow</option>
        </select>
    </div>

    <!-- Bookmap Style Heatmap UI -->
    <div id="heatmap-container">
        <div class="heatmap-grid" id="heatmapGrid"></div>
        <div class="orderbook-side" id="orderBookSide">
            <div style="color: #f6465d; font-weight: bold;">ASKS</div>
            <span id="askPrice1">--</span><br>
            <span id="askPrice2">--</span><br>
            <hr style="border-color:#30363d">
            <div style="color: #0ecb81; font-weight: bold;">BIDS</div>
            <span id="bidPrice1">--</span><br>
            <span id="bidPrice2">--</span>
        </div>
    </div>

    <button class="btn-primary" onclick="calculateRealTradeSignal()">📊 Calculate Live Trade Signal</button>

    <!-- Signal Output Box -->
    <div class="signal-box">
        <h3 id="signalStatus">Status: Ready for Live Analysis</h3>
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">Live Entry Price</div>
                <div class="metric-value" id="valEntry">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Take Profit (TP)</div>
                <div class="metric-value" id="valTP" style="color: #0ecb81;">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Stop Loss (SL)</div>
                <div class="metric-value
