<!DOCTYPE html>
<html lang="en">
<head>

    <title>Vidya - Real Account Trader Terminal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

            margin: 0;
            padding: 12px;

        }

            margin-bottom: 12px;
        }
        .card {

            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 12px;
            font-weight: bold;
            color: #f0b90b;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            color: #fff;
            border: 1px solid #2b313a;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }
        select { flex: 1; }
        .btn-start {
            background-color: #0ecb81;
            color: #000;
            font-weight: bold;
            border: none;
        }
        .btn-stop {
            background-color: #f6465d;
            color: #fff;
            font-weight: bold;
            border: none;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 5px 0;
            border-bottom: 1px solid #21262d;
        }
        .metric-row span { color: #fff; font-weight: bold; }
        .signal-box {
            background: #1e2329;
            border: 1px solid #0ecb81;
            border-radius: 6px;

            margin-top: 8px;

        .badge {

            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        .badge-live { background: rgba(14, 203, 129, 0.2); color: #0ecb81; border: 1px solid #0ecb81; }
        .badge-tp { background: rgba(14, 203, 129, 0.2); color: #0ecb81; }
        .badge-sl { background: rgba(246, 70, 93, 0.2); color: #f6465d; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-top: 8px;
        }
        th, td {
            border: 1px solid #21262d;
            padding: 6px;
            text-align: center;
        }
        th { background: #1b2028; color: #848e9c; }
    </style>
</head>
