<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidya - SMC Direct Terminal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0b0e11; color: #d1d4dc; padding: 12px; margin: 0; }
        h1 { font-size: 18px; color: #f0b90b; margin-bottom: 4px; }
        .subtitle { font-size: 11px; color: #848e9c; margin-bottom: 12px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
        .asset-card { background: #1e2329; border: 1px solid #2b313a; border-radius: 6px; padding: 10px; }
        .controls { display: flex; gap: 8px; margin-bottom: 12px; }
        button { background-color: #1e2329; color: #fff; border: 1px solid #2b313a; padding: 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-green { background-color: #0ecb81; color: #000; }
        .btn-blue { background-color: #2b6cb0; color: #fff; }
        .btn-red { background-color: #f6465d; color: #fff; }
        .metric-row { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; border-bottom: 1px solid #21262d; }
        .metric-row span { color: #fff; font-weight: bold; }
        .badge-buy { background: rgba(14,203,129,0.2); color: #0ecb81; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .badge-sell { background: rgba(246,70,93,0.2); color: #f6465d; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Vidya SMC Direct Engine</h1>
    <div class="subtitle">Real Binance Data • Instant Backtest & Live Signals</div>

    <div class="controls">
        <button id="scanBtn" class="btn-green" onclick="toggleScanner()">▶ Start Live Signal Engine</button>
        <button id="btBtn" class="btn-blue" onclick="toggleBacktest()">▶ Start Backtest Engine</button>
    </div>

    <div class="grid-2">
        <div class="card">
            <div style="font-size:12px; font-weight:bold; color:#f0b90b; margin-bottom:6px;">💼 PAPER WALLET</div>
            <div class="metric-row">Account Balance: <span id="wBalance">$10,000.00</span></div>
            <div class="metric-row">Total PnL: <span id="wPnL" style="color:#0ecb81;">$0.00</span></div>
        </div>

        <div class="card">
            <div style="font-size:12px; font-weight:bold; color:#f0b90b; margin-bottom:6px;">🧠 BACKTEST ACCURACY</div>
            <div class="metric-row">Total Scans: <span id="btTotal">0</span></div>
            <div class="metric-row">Calculated Win Rate: <span id="btWinRate" style="color:#0ecb81;">0.0%</span></div>
        </div>
    </div>

    <div class="card" style="border-color: #0ecb81;">
        <div style="font-size:12px; font-weight:bold; color:#f0b90b; margin-bottom:8px;">⚡ LIVE SIGNAL BOARD</div>
        <div class="grid-4" id="signalBoard">
            <div class="asset-card"><b>BTC/USDT</b><br><span style="color:#848e9c; font-size:10px;">Idle...</span></div>
            <div class="asset-card"><b>ETH/USDT</b><br><span style="color:#848e9c; font-size:10px;">Idle...</span></div>
            <div class="asset-card"><b>SOL/USDT</b><br><span style="color:#848e9c; font-size:10px;">Idle...</span></div>
            <div class="asset-card"><b>XAU/USD</b><br><span style="color:#848e9c; font-size:10px;">Idle...</span></div>
        </div>
    </div>

    <script src="strategies.js"></script>
    <script src="engine.js"></script>
    <script src="backtester.js"></script>
    <script>
        let isScanning = false;
        let isBacktesting = false;
        let scanTimer = null;
        let btTimer = null;
        const assets = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XAUUSD'];

        window.onload = function() {
            updateUI();
        };

        function updateUI() {
            if (typeof VidyaBacktesterModule !== 'undefined') {
                let bt = VidyaBacktesterModule.getState();
                document.getElementById('btTotal').innerText = bt.totalScans || 0;
                document.getElementById('btWinRate').innerText = (bt.winRate || 0).toFixed(1) + "%";
            }
            if (typeof VidyaEngineModule !== 'undefined') {
                let w = VidyaEngineModule.getWallet();
                document.getElementById('wBalance').innerText = "$" + w.balance.toFixed(2);
                document.getElementById('wPnL').innerText = "$" + w.totalPnL.toFixed(2);
            }
        }

        function toggleBacktest() {
            isBacktesting = !isBacktesting;
            let btn = document.getElementById('btBtn');
            if (isBacktesting) {
                btn.innerText = "⏸ Pause Backtest";
                btn.className = "btn-red";
                runBacktestLoop();
                btTimer = setInterval(runBacktestLoop, 3000);
            } else {
                btn.innerText = "▶ Start Backtest Engine";
                btn.className = "btn-blue";
                clearInterval(btTimer);
            }
        }

        async function runBacktestLoop() {
            for (let sym of assets) {
                await VidyaBacktesterModule.runBacktest(sym);
                updateUI();
            }
        }

        function toggleScanner() {
            isScanning = !isScanning;
            let btn = document.getElementById('scanBtn');
            if (isScanning) {
                btn.innerText = "⏸ Pause Scanner";
                btn.className = "btn-red";
                runLiveScan();
                scanTimer = setInterval(runLiveScan, 4000);
            } else {
                btn.innerText = "▶ Start Live Signal Engine";
                btn.className = "btn-green";
                clearInterval(scanTimer);
            }
        }

        async function runLiveScan() {
            let board = document.getElementById('signalBoard');
            let html = '';

            for (let sym of assets) {
                let sig = await VidyaEngineModule.evaluateLiveSweepSignal(sym);
                if (sig) {
                    let isBuy = sig.direction === 'BUY';
                    html += `
                        <div class="asset-card" style="border: 1px solid ${isBuy ? '#0ecb81' : '#f6465d'}; background: #182026;">
                            <div style="display:flex; justify-content:space-between;">
                                <b>${sym}</b>
                                <span class="${isBuy ? 'badge-buy' : 'badge-sell'}">${sig.direction} (${sig.rrRatio})</span>
                            </div>
                            <div class="metric-row">Entry: <span>$${sig.entry.toFixed(2)}</span></div>
                            <div class="metric-row">Target TP: <span style="color:#0ecb81;">$${sig.targetTP.toFixed(2)}</span></div>
                            <div class="metric-row">Stop Loss: <span style="color:#f6465d;">$${sig.stopLoss.toFixed(2)}</span></div>
                        </div>
                    `;
                } else {
                    html += `<div class="asset-card"><b>${sym}</b><br><span style="color:#0ecb81; font-size:10px;">Scanning Live Candles...</span></div>`;
                }
            }
            board.innerHTML = html;
        }
    </script>
</body>
</html>
